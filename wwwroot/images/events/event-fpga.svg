  <text x="92" y="560" fill="#ffffff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">FPGA</text>
  <text x="92" y="632" fill="#ffffff" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="800">Fundamentals</text>
  <text x="92" y="704" fill="#cdd7e6" font-size="28" font-family="Inter, Arial, sans-serif">RTL design · synthesis · deployment</text>
