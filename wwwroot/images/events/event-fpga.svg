      <line x1="78" y1="92" x2="242" y2="92"/>
      <line x1="78" y1="160" x2="242" y2="160"/>
      <line x1="78" y1="228" x2="242" y2="228"/>
      <line x1="92" y1="78" x2="92" y2="242"/>
      <line x1="160" y1="78" x2="160" y2="242"/>
      <line x1="228" y1="78" x2="228" y2="242"/>
