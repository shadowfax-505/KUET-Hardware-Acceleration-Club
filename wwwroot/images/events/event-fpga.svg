<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">FPGA Fundamentals Bootcamp</title>
  <desc id="desc">Abstract gradient card for the FPGA fundamentals bootcamp event.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111d"/>
      <stop offset="55%" stop-color="#16253b"/>
      <stop offset="100%" stop-color="#244a73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd2ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <circle cx="970" cy="140" r="220" fill="#5fd2ff" opacity="0.12"/>
  <circle cx="155" cy="650" r="260" fill="#8b5cf6" opacity="0.16"/>
  <rect x="78" y="78" width="360" height="168" rx="28" fill="#ffffff" opacity="0.05"/>
  <rect x="86" y="612" width="560" height="120" rx="24" fill="#ffffff" opacity="0.06"/>
