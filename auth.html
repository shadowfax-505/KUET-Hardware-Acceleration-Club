<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register / Login - Hardware Acceleration Club of KUET</title>
    <link rel="stylesheet" href="Content/site.css" />
</head>
<body data-page="auth">
    <header class="site-header">
        <div class="brand">Hardware Acceleration Club of KUET</div>
        <nav class="top-menu" id="topMenu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="events.html">Events</a>
            <a href="executives.html">Executives</a>
            <a href="advisors.html">Faculty Advisors</a>
            <a href="contact.html">Contact</a>
            <a href="auth.html" id="authNavLink">Register / Login</a>
            <button type="button" id="logoutBtn" class="link-button hidden">Logout</button>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
    </header>

    <main class="container">
        <div id="authMessage" class="alert hidden"></div>

        <section class="two-column">
            <article class="card">
                <h2>Register as Member</h2>
                <form id="registerForm">
                    <label for="regFullName">Full Name</label>
                    <input id="regFullName" type="text" name="FullName" required />

                    <label for="regStudentId">Student ID</label>
                    <input id="regStudentId" type="text" name="StudentId" required />

                    <label for="regEmail">Email</label>
                    <input id="regEmail" type="email" name="Email" required />

                    <label for="regDepartment">Department</label>
                    <input id="regDepartment" type="text" name="Department" required />

                    <label for="regPassword">Password</label>
                    <input id="regPassword" type="password" name="Password" required />

                    <button type="submit" class="btn-primary">Register</button>
                </form>
            </article>

            <article class="card">
                <h2>Member Login</h2>
                <p class="muted">Demo account: member1@kuet.ac.bd / member123</p>
                <form id="loginForm">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" name="Email" required />

                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" name="Password" required />

                    <button type="submit" class="btn-primary">Login</button>
                </form>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        © <span id="footerYear"></span> Hardware Acceleration Club of KUET · Built with HTML, CSS, and JavaScript
    </footer>

    <script src="Scripts/site.js"></script>
</body>
</html>
